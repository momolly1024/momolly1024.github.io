<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Molly Chi · Frontend Engineer</title>
  <meta name="description" content="Molly Chi — UX-focused frontend engineer who builds faster with AI (Vue 3 / React / React Native). Explore my résumé as a pixel town, or download the one-page PDF.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261028a">
</head>
<body>
  <canvas id="game" aria-label="Pixel town map"></canvas>

  <header class="hud">
    <div class="hud-name"><strong>Molly Chi</strong><span data-t="hudTitle"></span></div>
    <div class="hud-progress" id="progress" aria-live="polite"></div>
    <div class="hud-actions">
      <button class="btn-icon" id="langBtn" data-t="langToggle"></button>
      <button class="btn-icon" id="muteBtn" aria-label="Sound">🔊</button>
      <a class="btn" id="classicBtn" data-t="classic" href="resume.html"></a>
    </div>
  </header>

  <div class="prompt" id="prompt" hidden></div>
  <div class="hint" id="hint" data-t="hint"></div>

  <div class="touch" id="touch" aria-hidden="true">
    <div class="dpad">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
    </div>
    <button class="abtn" id="aBtn">A</button>
  </div>

  <div class="overlay" id="panelOverlay" hidden>
    <article class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <button class="close" id="panelClose" aria-label="Close">✕</button>
      <div class="panel-body" id="panelBody"></div>
    </article>
  </div>

  <div class="overlay intro" id="intro">
    <div class="panel intro-card">
      <button class="btn-icon intro-lang" id="introLangBtn" data-t="langToggle"></button>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1>Molly's Town</h1>
      <p class="lead" data-t-html="introLead"></p>
      <div class="intro-actions">
        <button class="btn btn-primary" id="startBtn" data-t="start"></button>
        <a class="btn" id="introClassicBtn" data-t="justResume" href="resume.html"></a>
      </div>
      <div class="intro-contact" id="introContact"></div>
      <p class="small" data-t="introHelp"></p>
    </div>
  </div>

  <footer class="credit">Pixel art &amp; sounds by <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0)</footer>

  <noscript><p style="padding:2rem;font-family:sans-serif">This interactive résumé needs JavaScript. <a href="assets/Molly_Chi_Resume_EN.pdf">Download PDF (EN)</a> · <a href="assets/Molly_Chi_Resume_ZH.pdf">下載 PDF（中文）</a> · momolly1024@gmail.com</p></noscript>

  <script src="data.js?v=20261028a"></script>
  <script src="ux-cases.js?v=20261028a"></script>
  <script src="game.js?v=20261028a"></script>
</body>
</html>
